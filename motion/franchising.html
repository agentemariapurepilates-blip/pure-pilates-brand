<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure Pilates · Franchising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#C12030; --vermelho-vivo:#E11B2E;
  --creme:#F4EFE7; --creme-2:#EDE6DA;
  --preto:#231F20; --lima:#C8D92C;
  --azul:#2B5FD9; --ambar:#E8A020; --verde:#12A05A;
  --madeira:#C98A52; --madeira-2:#A96C3C; --grafite:#2B2B2E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Montserrat,Arial,sans-serif}

#palco{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
       transform-origin:center;overflow:hidden;background:var(--creme)}
.cena{position:absolute;inset:0}
.cena.saindo{animation:sair .5s cubic-bezier(.4,0,.6,1) forwards}
@keyframes sair{to{opacity:0;filter:blur(20px);transform:scale(1.03)}}

.bg-creme{background:radial-gradient(120% 90% at 70% 20%,#FBF7F1,var(--creme) 45%,var(--creme-2))}
.bg-preto{background:#050505}
.bg-lima{background:var(--lima)}
.bg-bordo{background:radial-gradient(90% 80% at 30% 45%,#6B1418,#3A0B0E 55%,#1A0406)}


/* ---------- inserts de vídeo: sempre com texto por cima ---------- */
.video-fundo{position:absolute;inset:0;overflow:hidden;z-index:0}
.video-fundo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .5s ease}
.video-fundo video.solo{opacity:1}
.video-fundo video.seq{opacity:0;animation:vidFade 2.5s ease forwards}
@keyframes vidFade{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0}}
.veu{position:absolute;inset:0}
.acima{position:relative;z-index:2}

.video-cartao{position:relative;width:88%;aspect-ratio:16/10;border-radius:26px;overflow:hidden;
  box-shadow:0 44px 70px rgba(70,45,35,.22);opacity:0;transform:translateY(46px) scale(.95);
  animation:entraHeroi 1s cubic-bezier(.16,1,.3,1) .3s forwards}
.video-cartao video{width:100%;height:100%;object-fit:cover}

/* ---------- brasa ---------- */
.brasa{position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,#FF4A22,#C1201F 22%,rgba(140,20,20,.45) 42%,transparent 68%);
  filter:blur(6px);animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
.fagulha{position:absolute;width:4px;height:4px;border-radius:50%;background:#FF7A3C;opacity:0;
  animation:sobe 3.2s linear infinite}
@keyframes sobe{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-320px) scale(.2)}}

/* ---------- tipografia ---------- */
.rotulo{font-size:19px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
        color:var(--vermelho);margin-bottom:26px}
.manchete{font-weight:900;text-transform:uppercase;color:var(--preto);
          font-size:80px;line-height:.98;letter-spacing:-.02em;max-width:15ch}
.manchete.media{font-size:64px;max-width:19ch}
.manchete.pequena{font-size:50px;max-width:25ch;line-height:1.04}
.linha{display:block;overflow:hidden;padding-bottom:.06em}
.linha>span{display:block;transform:translateY(105%);animation:sobeLinha .8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes sobeLinha{to{transform:translateY(0)}}
.sub{margin-top:34px;font-size:23px;line-height:1.5;color:#5A5350;max-width:46ch}
.fade{opacity:0;animation:aparece .7s ease forwards}
@keyframes aparece{to{opacity:1}}
.grifo{position:relative;display:inline-block;padding:0 .12em;z-index:0}
.grifo::before{content:"";position:absolute;left:0;right:0;top:14%;bottom:10%;background:var(--lima);
  z-index:-1;transform:scaleX(0);transform-origin:left;animation:varre .5s cubic-bezier(.7,0,.3,1) forwards}
@keyframes varre{to{transform:scaleX(1)}}
.vermelho{color:var(--vermelho-vivo)}

.bloco{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;
       padding:0 120px;gap:60px}
.texto{z-index:2;position:relative}

/* telas de texto que se revezam dentro do mesmo bloco */
.tela-txt{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.tela-txt.on{opacity:1;transform:none}
.tela-txt.off{opacity:0;transform:translateY(-14px)}
.tela-txt.sobreposta{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}

/* frase grande que substitui a manchete */
.frase{font-size:46px;line-height:1.28;font-weight:600;color:var(--preto);max-width:24ch}
.frase b{font-weight:900}

/* digitação */
.digita::after{content:"";display:inline-block;width:3px;height:1em;margin-left:4px;
  background:var(--vermelho);vertical-align:-.12em;animation:pisca .8s steps(1) infinite}
.digita.pronto::after{display:none}
@keyframes pisca{0%,50%{opacity:1}51%,100%{opacity:0}}
.visual{position:relative;height:100%;display:flex;align-items:center;justify-content:center;perspective:1500px}

/* ================= MAPA — pins nascem um a um ================= */
.mapa{position:relative;width:560px;filter:drop-shadow(0 40px 46px rgba(120,80,50,.16))}
.mapa svg{width:100%;display:block}
.pin{position:absolute;width:20px;height:20px;transform:translate(-50%,-100%) scale(0);
     transform-origin:bottom center;animation:pipoca .5s cubic-bezier(.34,1.56,.64,1) forwards}
.pin i{display:block;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--vermelho-vivo);
       transform:rotate(-45deg);box-shadow:0 4px 8px rgba(180,20,30,.4)}
.pin b{position:absolute;left:50%;bottom:-3px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
       border:2px solid rgba(225,27,46,.55);transform:scale(0);animation:onda 1.6s ease-out infinite}
@keyframes pipoca{to{transform:translate(-50%,-100%) scale(1)}}
@keyframes onda{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ================= CANAIS — cards + fios que se desenham ================= */
.canais{position:relative;width:640px;height:520px}
.canal{position:absolute;width:250px;background:#fff;border-radius:18px;padding:16px 18px;
  box-shadow:0 22px 40px rgba(80,55,40,.14);display:flex;align-items:center;gap:12px;
  opacity:0;transform:translateX(-46px) scale(.92);
  animation:entraCanal .6s cubic-bezier(.16,1,.3,1) forwards}
@keyframes entraCanal{to{opacity:1;transform:translateX(0) scale(1)}}
.canal .dot{width:22px;height:22px;border-radius:50%;flex:none}
.canal .nome{font-size:16px;font-weight:700;color:var(--preto)}
.canal .tipo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A79D96;font-weight:700}
.fios{position:absolute;inset:0;overflow:visible}
.fios path{fill:none;stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:420;stroke-dashoffset:420;animation:desenha 1s ease-out forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.no-luz{position:absolute;right:6px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;
  background:radial-gradient(circle,#fff,#FFD08A 40%,rgba(255,170,60,0) 72%);
  transform:scale(0);animation:pipoca2 .6s cubic-bezier(.34,1.56,.64,1) 4.2s forwards}
@keyframes pipoca2{to{transform:scale(1)}}
.balao-wa{position:absolute;right:-20px;bottom:14%;background:#DCF8C6;border-radius:16px;
  border-bottom-right-radius:4px;padding:14px 18px;font-size:18px;color:#2B3A2E;
  box-shadow:0 18px 32px rgba(80,55,40,.16);opacity:0;transform:translateY(16px);
  animation:aparece2 .5s ease 6.4s forwards}
@keyframes aparece2{to{opacity:1;transform:translateY(0)}}

/* ================= FONE / CHAT ================= */
.fone{width:330px;height:660px;border-radius:46px;background:#111;padding:12px;
  box-shadow:0 60px 90px rgba(60,35,25,.3);transform:rotateY(-14deg) rotateX(4deg) translateY(50px);
  opacity:0;animation:entraFone 1s cubic-bezier(.16,1,.3,1) .3s forwards}
@keyframes entraFone{to{opacity:1;transform:rotateY(-14deg) rotateX(4deg) translateY(0)}}
.tela{width:100%;height:100%;border-radius:36px;background:#EFE7DE;overflow:hidden;display:flex;flex-direction:column}
.topo{background:#0C6157;color:#fff;padding:14px 16px;font-size:13px;font-weight:700}
.topo small{display:block;font-weight:400;opacity:.75;font-size:10px}
.chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
.balao{max-width:84%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.35;
  opacity:0;transform:translateY(12px) scale(.96);animation:aparece3 .4s cubic-bezier(.34,1.4,.64,1) forwards}
@keyframes aparece3{to{opacity:1;transform:translateY(0) scale(1)}}
.balao.dele{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.balao.dela{background:#DCF8C6;align-self:flex-end;border-top-right-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:#fff;border:1px solid #E3DCD3;border-radius:999px;padding:4px 10px;font-size:10.5px;color:#5A5350}

/* ================= ECOSSISTEMA — objetos orbitando ================= */
.orbita{position:relative;width:560px;height:560px}
.nucleo{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FF6A55,var(--vermelho-vivo) 55%,#8E0F1C);
  box-shadow:0 0 70px rgba(225,27,46,.4),inset -14px -18px 34px rgba(0,0,0,.28);
  transform:scale(0);animation:pipoca2 .7s cubic-bezier(.34,1.56,.64,1) forwards}
.sat{position:absolute;left:50%;top:50%;transform-origin:center;opacity:0;
  animation:entraSat .8s cubic-bezier(.16,1,.3,1) forwards, gira 18s linear infinite}
@keyframes entraSat{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1}}
@keyframes gira{to{}}
.objeto{background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(80,55,40,.18);
  border:1px solid #EAE2D8;position:relative;overflow:hidden}
.obj-fone{width:110px;height:200px;border-radius:20px;background:#fff}
.obj-fone .bar{height:26px;background:var(--vermelho);opacity:.9}
.obj-fone .ln{height:8px;margin:12px 14px;border-radius:4px;background:#EDE6DA}
.obj-note{width:220px;height:140px;border-radius:14px}
.obj-note .bar{height:22px;background:#EDE6DA}
.obj-note .ln{height:8px;margin:12px 16px;border-radius:4px;background:#F0EAE1}
.obj-note .pe{position:absolute;left:12%;right:12%;bottom:-8px;height:8px;border-radius:0 0 8px 8px;background:#E3DBD1}
.obj-cal{width:150px;height:170px}
.obj-cal .bar{height:30px;background:var(--verde);opacity:.85}
.obj-cal .grade{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px}
.obj-cal .grade i{display:block;height:14px;border-radius:3px;background:#EDE6DA}
.obj-cal .grade i.on{background:var(--lima)}

/* ================= REFORMER SVG — monta peça por peça ================= */
.reformer{width:660px}
.reformer svg{width:100%;display:block;overflow:visible}
.peca{opacity:0;animation:montaPeca .85s cubic-bezier(.16,1,.3,1) forwards}
@keyframes montaPeca{to{opacity:1;transform:translate(0,0)}}

/* ================= WELLHUB — moedas correndo ================= */
.repasse{position:relative;width:620px;height:420px;display:flex;align-items:center;justify-content:space-between}
.cartao-w{border-radius:22px;box-shadow:0 26px 46px rgba(80,55,40,.2);opacity:0;
  animation:entraCartaoW .7s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
@keyframes entraCartaoW{from{opacity:0;transform:translateY(30px) rotate(-8deg) scale(.9)}
                        to{opacity:1;transform:translateY(0) rotate(-7deg) scale(1)}}
.cartao-w.destino{animation-name:entraCartaoD}
@keyframes entraCartaoD{from{opacity:0;transform:translateY(30px) rotate(8deg) scale(.9)}
                        to{opacity:1;transform:translateY(0) rotate(6deg) scale(1)}}
.w-origem{width:240px;height:150px;background:linear-gradient(135deg,#FF8A2B,#F26B21)}
.w-destino{width:200px;height:130px;background:#fff;border:1px solid #EDE6DA;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.w-destino .cap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A79D96;font-weight:800}
.w-destino .val{font-size:30px;font-weight:900;color:var(--preto)}
.moeda{position:absolute;left:250px;top:50%;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFE9A8,#F4B740 60%,#C98A18);
  box-shadow:0 2px 6px rgba(190,130,20,.4);opacity:0;
  animation:voa 1.8s ease-in-out infinite}
@keyframes voa{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  12%{opacity:1}
  50%{transform:translate(70px,-72px) scale(1)}
  88%{opacity:1}
  100%{opacity:0;transform:translate(150px,10px) scale(.6)}
}

/* ================= GRADE DE UNIDADES ================= */
.grade-un{display:grid;grid-template-columns:repeat(8,1fr);gap:15px;width:540px;
  transform:rotateX(54deg) rotateZ(-30deg);transform-style:preserve-3d}
.grade-un i{display:block;aspect-ratio:1;border-radius:9px;background:#fff;
  box-shadow:0 10px 18px rgba(80,55,40,.16);transform:scale(0);
  animation:pipocaUn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.grade-un i.on{background:var(--vermelho-vivo);box-shadow:0 12px 22px rgba(190,25,40,.35)}
@keyframes pipocaUn{to{transform:scale(1)}}

/* ================= FUNIL ================= */
.barras{display:flex;align-items:flex-end;gap:38px;height:340px}
.barra{width:112px;border-radius:12px 12px 4px 4px;transform-origin:bottom;transform:scaleY(0);
  animation:cresce .8s cubic-bezier(.16,1,.3,1) forwards;position:relative}
.barra span{position:absolute;bottom:-38px;left:0;right:0;text-align:center;font-size:14px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7A716C}
@keyframes cresce{to{transform:scaleY(1)}}

/* ================= CONTADOR / CARTÕES ================= */
.contador{font-size:96px;font-weight:900;color:var(--preto);letter-spacing:-.03em;line-height:1}
.contador .de{color:#B9AFA8}
.contador .seta{color:var(--vermelho);margin:0 .12em}
.cartao{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 26px 46px rgba(80,55,40,.14);
  opacity:0;transform:translateY(28px);animation:aparece2 .6s cubic-bezier(.16,1,.3,1) forwards}
.cartao h4{font-size:19px;font-weight:800;color:var(--preto)}
.cartao .cap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A79D96;font-weight:800;margin-bottom:4px}

/* ================= CARTELAS / FECHO ================= */
.cartela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.cartela .palavra{font-size:128px;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;color:var(--preto);text-align:center}
.cartela .trilha{font-size:15px;letter-spacing:.34em;text-transform:uppercase;font-weight:800;color:rgba(35,31,32,.5)}
.bg-bordo .palavra{background:linear-gradient(95deg,#E8341F,#F07A1E 55%,#F6A623);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bg-bordo .trilha{color:rgba(255,220,200,.45)}
.fecho{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.marca-cartao{background:var(--creme);border-radius:20px;padding:28px 44px}
.marca-cartao img{height:88px;display:block}
.tagline{color:#F2E4DC;font-size:26px;font-weight:600}
.prova{color:rgba(242,228,220,.6);font-size:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.cta{margin-top:10px;background:var(--vermelho-vivo);color:#fff;font-size:22px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:16px 36px;border-radius:10px}
.linha-dados{position:absolute;left:0;right:0;bottom:120px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(225,27,46,.7),transparent);
  transform:scaleX(0);transform-origin:left;animation:varre 2.6s ease forwards}

#hud{position:fixed;left:16px;bottom:16px;z-index:99;display:flex;gap:10px;align-items:center;
     font:600 13px Montserrat,sans-serif;color:#fff}
#hud button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
#hud button:hover{background:rgba(255,255,255,.22)}
#hud .t{opacity:.6;font-variant-numeric:tabular-nums}
body.gravando #hud{display:none}

/* ---------- texto sobre insert: cor + fundo de leitura por blur ---------- */
.sobre-video,
h1.manchete.sobre-video,
p.frase.sobre-video,
.contador.sobre-video{ color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.4) }
h1.manchete.sobre-video .vermelho,
.sobre-video .vermelho{ color:#FF5A63 }
.sobre-video b{ color:#fff }

/* a placa só desfoca o que está atrás da tipografia, colada nela */
.placa{ position:relative; z-index:1 }
.placa::before{
  content:""; position:absolute; inset:-22px -40px; z-index:-1; border-radius:26px;
  backdrop-filter:blur(18px) brightness(.82);
  -webkit-backdrop-filter:blur(18px) brightness(.82);
  -webkit-mask-image:radial-gradient(118% 128% at 50% 50%,#000 52%,transparent 100%);
  mask-image:radial-gradient(118% 128% at 50% 50%,#000 52%,transparent 100%);
}
.placa.centro::before{ inset:-30px -56px }
</style>
</head>
<body>
<div id="palco"></div>
<div id="hud">
  <button id="btPlay">▶ Play</button>
  <button id="btReset">⟲ Reiniciar</button>
  <button id="btLimpo">Modo gravação</button>
  <button id="btSom">🔊 Som</button>
  <span class="t" id="relogio"></span>
</div>

<script>
/* ==================================================================
   Pure Pilates · Franchising — motion
   Tudo em CSS/SVG: cada peça anima sozinha.
   Roteiro = array CENAS. Trocar copy é editar texto aqui embaixo.
================================================================== */

const PASSO = .62;   // beat entre uma frase e a próxima

/* manchete: uma frase por vez */
const mh = (linhas, cls="", ini=.25) =>
  `<h1 class="manchete ${cls}">` + linhas.map((l,i)=>
    `<span class="linha"><span style="animation-delay:${(ini+i*PASSO).toFixed(2)}s">${l}</span></span>`
  ).join("") + `</h1>`;
const fimDe = (linhas, ini=.25) => ini + linhas.length*PASSO + .25;
const sub = (t,d) => `<p class="sub fade" style="animation-delay:${d.toFixed(2)}s">${t}</p>`;
const rot = t => `<div class="rotulo fade" style="animation-delay:.05s">${t}</div>`;

/* --- mapa do Brasil: contorno real, coordenadas derivadas de lon/lat --- */
const BR_PATH =
 "M549 64 L590 120 L624 198 L660 205 L718 223 L790 232 L849 251 L900 272 L923 299 L932 329 "+
 "L930 350 L905 395 L870 430 L849 465 L838 507 L820 560 L808 634 L775 665 L743 696 L700 710 "+
 "L673 719 L645 740 L624 753 L624 802 L597 841 L560 890 L513 942 L470 900 L430 852 L455 800 "+
 "L486 753 L460 700 L430 650 L417 604 L417 537 L390 500 L330 470 L290 440 L246 415 L180 390 "+
 "L120 355 L72 338 L100 300 L142 262 L175 220 L205 163 L250 120 L290 80 L310 45 L340 70 "+
 "L360 110 L405 119 L472 115 Z";

/* cidades reais — [x%, y%] no mesmo espaço do viewBox, peso no Sudeste */
const PINS = [
  [66.7,70.8],[65.5,69.4],[64.6,70.8],[67.3,71.9],[64.0,65.5],[60.4,64.5], // SP e interior
  [74.3,69.4],[80.8,63.4],                                                  // RJ, Vitória
  [72.7,62.5],[62.8,60.2],                                                  // BH, Uberlândia
  [60.6,75.1],[56.3,70.3],[62.4,80.2],[56.3,85.7],                          // Sul
  [63.7,53.0],[60.6,55.1],[40.3,52.5],                                      // Centro-Oeste
  [84.9,46.5],[91.2,38.9],[93.1,35.1],[92.3,29.9],[84.9,25.2],              // Nordeste
  [71.8,22.4],[62.4,19.9],[36.5,23.7],                                      // Norte
];
const mapa = () => `
  <div class="mapa">
    <svg viewBox="0 0 1000 1000">
      <path d="${BR_PATH}" fill="#EDE3D4" stroke="#DCCFBB" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    ${PINS.map(([x,y],i)=>`<div class="pin" style="left:${x}%;top:${y}%;animation-delay:${(.9+i*.075).toFixed(2)}s">
        <i></i><b style="animation-delay:${(1.2+i*.075).toFixed(2)}s"></b></div>`).join("")}
  </div>`;

/* --- canais + fios --- */
const CANAIS = [
  ["Google Ads","mídia paga","#4285F4",   6,  -190],

/* ==================================================================
   SOM — trilha + efeitos, sintetizados em Web Audio.
   A música roda a 100 BPM (1 tempo = 0,6s), o mesmo PASSO do texto:
   cada frase que sobe cai em cima de um tempo da batida.
================================================================== */
let ac=null, bus=null, busMus=null, busFx=null;

function audioOn(){
  if(ac) return;
  ac = new (window.AudioContext||window.webkitAudioContext)();
  bus    = ac.createGain(); bus.gain.value=.9;    bus.connect(ac.destination);
  busMus = ac.createGain(); busMus.gain.value=.95; busMus.connect(bus);
  busFx  = ac.createGain(); busFx.gain.value=.42;  busFx.connect(bus);
}
const ruido = dur => {
  const n=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=ac.createBufferSource(); s.buffer=b; return s;
};
const env = (node,t,a,dec,pico=1,dest=null) => {
  const g=ac.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(pico,t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
  node.connect(g); g.connect(dest||busFx); return g;
};

/* ---------------- efeitos ---------------- */
const SFX = {
  whoosh(t,f=1){ const s=ruido(.5),bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(320*f,t); bp.frequency.exponentialRampToValueAtTime(2600*f,t+.22);
    s.connect(bp); env(bp,t,.04,.3,.16); s.start(t); s.stop(t+.5); },
  thock(t,p=110){ const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(p*1.9,t); o.frequency.exponentialRampToValueAtTime(p,t+.09);
    env(o,t,.004,.26,.42); o.start(t); o.stop(t+.4); },
  pop(t,p=760){ const o=ac.createOscillator(); o.type="triangle";
    o.frequency.setValueAtTime(p,t); o.frequency.exponentialRampToValueAtTime(p*.45,t+.1);
    env(o,t,.003,.12,.14); o.start(t); o.stop(t+.2); },
  snap(t){ const s=ruido(.12),hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=2400;
    s.connect(hp); env(hp,t,.002,.09,.26); s.start(t); s.stop(t+.14);
    const o=ac.createOscillator(); o.type="square"; o.frequency.setValueAtTime(220,t);
    env(o,t,.002,.06,.08); o.start(t); o.stop(t+.1); },
  tick(t){ const o=ac.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(1180,t);
    env(o,t,.002,.05,.07); o.start(t); o.stop(t+.09); },
  boom(t){ const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+.5);
    env(o,t,.006,.9,.7); o.start(t); o.stop(t+1.1);
    const s=ruido(.5),lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
    s.connect(lp); env(lp,t,.004,.4,.2); s.start(t); s.stop(t+.6); },
  shimmer(t){ [1568,2093,2637].forEach((f,i)=>{ const o=ac.createOscillator();
    o.type="triangle"; o.frequency.value=f; env(o,t+i*.05,.004,.3,.045);
    o.start(t+i*.05); o.stop(t+i*.05+.4); }); },
  coracao(t){ [0,.34].forEach((d,k)=>{ const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(64,t+d); o.frequency.exponentialRampToValueAtTime(38,t+d+.16);
    env(o,t+d,.008,.3,k?.4:.6); o.start(t+d); o.stop(t+d+.4); }); },
  riser(t,dur=1.4){ const s=ruido(dur+.2),bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=2.2;
    bp.frequency.setValueAtTime(240,t); bp.frequency.exponentialRampToValueAtTime(4200,t+dur);
    s.connect(bp); const g=ac.createGain(); g.gain.setValueAtTime(.001,t);
    g.gain.exponentialRampToValueAtTime(.26,t+dur); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.18);
    bp.connect(g); g.connect(busFx); s.start(t); s.stop(t+dur+.25); },
};

/* ==================== TRILHA ====================
   100 BPM · compasso 4/4 · 1 tempo = .6s · 1 compasso = 2.4s
   Harmonia: Am – F – C – G, que é o ciclo que segura tensão e
   resolve pra frente sem ficar melancólico.
=================================================== */
const BPM=100, T=60/BPM, COMPASSO=4*T;
const AC_={Am:[220.00,261.63,329.63], F:[174.61,220.00,261.63],
           C:[261.63,329.63,392.00],  G:[196.00,246.94,392.00]};

const CICLO=["Am","F","C","G"];
/* melodia: 4 notas por compasso, nas posições 0 · 1,5 · 2,5 · 3,5 */
const MEL={ Am:[440.00,523.25,659.25,523.25], F:[349.23,440.00,523.25,440.00],
            C:[523.25,659.25,587.33,493.88], G:[493.88,587.33,392.00,493.88] };
const POS=[0,1.5,2.5,3.5];

/* que camadas tocam em cada compasso (0 a 41) */
function arranjo(c){
  if(c<4)  return {sub:1,kick:.55,hat:0,pad:.75,arp:0,  lead:0};  // abertura: pulso grave
  if(c<9)  return {sub:1,kick:1,hat:0,pad:1, arp:0,  lead:.9}; // marca
  if(c<14) return {sub:1,kick:1,hat:1,pad:1, arp:0,  lead:1};  // marketing
  if(c<15) return {sub:1,kick:0,hat:0,pad:1, arp:0,  lead:.5}; // respiro
  if(c<20) return {sub:1,kick:1,hat:1,pad:1, arp:.7, lead:1};  // vitória
  if(c<25) return {sub:1,kick:1,hat:1,pad:1, arp:1,  lead:1};  // tecnologia
  if(c<29) return {sub:1,kick:1,hat:1,pad:1, arp:.8, lead:1};  // metalife
  if(c<34) return {sub:1,kick:1,hat:1,pad:1, arp:1,  lead:1};  // wellhub
  if(c<38) return {sub:1,kick:1,hat:1,pad:1, arp:1,  lead:1.15}; // funil
  if(c<39) return {sub:1,kick:0,hat:0,pad:1, arp:0,  lead:.7}; // cartela final
  return    {sub:1,kick:0,hat:0,pad:1, arp:.5, lead:.8}; // fecho
}

function nota(tipo,t,f,dur,vol){
  const o=ac.createOscillator();
  if(tipo==="sub"){ o.type="sine"; o.frequency.value=f;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.setValueAtTime(vol,t+dur-.12);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(busMus); o.start(t); o.stop(t+dur+.05); fontesMus.push(o); return;
  }
  if(tipo==="pad"){ o.type="sawtooth"; o.frequency.value=f;
    const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=.6;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.5);
    g.gain.setValueAtTime(vol,t+dur-.5);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(busMus); o.start(t); o.stop(t+dur+.05); fontesMus.push(o); return;
  }
  if(tipo==="lead"){ o.type="triangle"; o.frequency.value=f;
    const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(busMus); o.start(t); o.stop(t+dur+.05); fontesMus.push(o); return;
  }
  if(tipo==="arp"){ o.type="triangle"; o.frequency.value=f;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(busMus); o.start(t); o.stop(t+dur+.05); fontesMus.push(o); return;
  }
}
function kick(t,vol){
  const o=ac.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.11);
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.32);
  o.connect(g); g.connect(busMus); o.start(t); o.stop(t+.36); fontesMus.push(o);
}
function hat(t,vol){
  const s=ruido(.06), hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=7000;
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.055);
  s.connect(hp); hp.connect(g); g.connect(busMus); s.start(t); s.stop(t+.08); fontesMus.push(s);
}

/* agenda um compasso inteiro */
function compasso(c, t0){
  const a=arranjo(c), ac_=CICLO[c%4], tri=AC_[ac_], baixo=BX[ac_];
  if(a.sub) nota("sub", t0, baixo, COMPASSO*.95, .38*a.sub);
  if(a.sub) nota("sub", t0, baixo*2, COMPASSO*.95, .12*a.sub);
  if(a.pad) tri.forEach(f=>nota("pad", t0, f, COMPASSO*.98, .10*a.pad));
  if(a.kick) [0,2].forEach(b=>kick(t0+b*T,.55*a.kick));
  if(a.kick && c>=20) kick(t0+3.5*T,.3);
  if(a.hat) for(let b=0;b<8;b++) hat(t0+b*T/2, (b%2? .11: .06)*a.hat);
  if(a.lead){ const mel=MEL[ac_];
    POS.forEach((b,k)=>nota("lead", t0+b*T, mel[k], k===3?.9:.55, .13*a.lead)); }
  if(a.arp){ const seq=[tri[0],tri[1],tri[2],tri[1],tri[2]*2,tri[1],tri[2],tri[0]];
    seq.forEach((f,i)=>nota("arp", t0+i*T/2, f, .34, .085*a.arp)); }
}

/* agenda o filme inteiro de uma vez: sem intervalo que possa não disparar */
let fontesMus=[];
function musicaStart(){
  musicaStop();
  const t0=ac.currentTime+.12;
  for(let c=0;c<44;c++) compasso(c, t0 + c*COMPASSO);
}
function musicaStop(){
  fontesMus.splice(0).forEach(o=>{ try{o.stop();}catch(e){} });
}

/* ---------------- efeitos por cena ---------------- */

const digTicks=(ini,n,passo=.13)=>Array.from({length:n},(_,i)=>[ini+i*passo,"tick"]);
const SONS = [
 /* 0 abertura */   [[.1,"coracao"],[1.3,"coracao"],[2.5,"coracao"],
                     [.35,"whoosh"],[.8,"thock",90],[.97,"whoosh"],[1.42,"thock",90],

 /* 1 marca vídeo */[[.4,"whoosh"],[.85,"thock",95],[1.02,"whoosh"],[1.47,"thock",95]],
 /* 2 marca 3D */   [...digTicks(.5,14,.12), [3.8,"shimmer"],
                     ...Array.from({length:25},(_,i)=>[.9+i*.075,"pop",640+i*22])],

                     [4.2,"shimmer"],[4.4,"pop",900],[5.9,"whoosh",.8],[6.4,"pop",980]],
 /* 4 vitória */    [...P2, [1.4,"tick"],[2.6,"tick"],[4.0,"tick"],[5.2,"tick"],[7.0,"pop",980],[5.3,"whoosh",.8]],
 /* 5 tecnologia */ [...P4, [.4,"pop",520],[.7,"snap"],[1.35,"snap"],[2.0,"snap"],[6.3,"whoosh",.8]],
 /* 6 metalife */   [...P2, [.35,"whoosh",.7],[.95,"snap"],[1.5,"snap"],[2.0,"snap"],
                     [2.4,"snap"],[2.8,"snap"],[3.15,"snap"],[3.5,"thock",80]],
 /* 7 wellhub */    [...P2, [.4,"tick"],[1.0,"tick"], ...Array.from({length:7},(_,i)=>[1.1+i*.22,"shimmer"]),
                     ...digTicks(5.9,18,.12)],
 /* 8 funil */      [...P2, [1.9,"whoosh"],[2.32,"thock"],[2.52,"whoosh"],[2.94,"thock",80]],
 /* 9 cartela */    [[.05,"riser",.8],[.85,"boom"]],
 /* 10 fecho */     [[.3,"pop",880],[1.2,"shimmer"]],
];
function tocaCena(n){
  if(!ac) return;
  const t0=ac.currentTime+.02;
  (SONS[n]||[]).forEach(([t,tipo,arg])=>{ const f=SFX[tipo]; if(f) f(t0+t,arg); });
}

/* ================== motor ================== */
const palco=document.getElementById("palco"), relogio=document.getElementById("relogio");
const TOTAL=CENAS.reduce((a,c)=>a+c.dur,0);
const escala=()=>palco.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;
addEventListener("resize",escala); escala();

let i=0,timer=null,t0=0,rodando=false;
const relogios=[];
const agendar=(fn,ms)=>{ const id=setTimeout(fn,ms); relogios.push(id); return id; };
const limpar=()=>{ relogios.splice(0).forEach(clearTimeout); };

/* telas de texto que se revezam */
function telas(el){
  el.querySelectorAll("[data-in]").forEach(n=>{
    agendar(()=>n.classList.add("on"), (+n.dataset.in)*1000);
    if(n.dataset.out!=null)
      agendar(()=>{ n.classList.remove("on"); n.classList.add("off"); }, (+n.dataset.out)*1000);
  });
}

/* efeito de digitação */
function digitacao(el){
  el.querySelectorAll("[data-digita]").forEach(n=>{
    const txt=n.dataset.digita, ini=(+n.dataset.atraso||0)*1000, vel=+n.dataset.vel||26;
    n.textContent="";
    agendar(()=>{
      n.classList.add("digita");
      let k=0;
      const it=setInterval(()=>{
        n.textContent=txt.slice(0,++k);
        if(k>=txt.length){ clearInterval(it); n.classList.add("pronto"); }
      }, vel);
      relogios.push(it);
    }, ini);
  });
}

/* contadores — cada um dispara no seu próprio momento, quando já está visível */
function contadores(el){
  el.querySelectorAll("[data-conta]").forEach(n=>{
    const alvo=+n.dataset.conta, suf=n.dataset.suf||"", atraso=(+n.dataset.atraso||0)*1000;
    const ini=+n.textContent||0, dur=1400;
    agendar(()=>{
      let s=null;
      const passo=ts=>{ if(!s)s=ts;
        const p=Math.min((ts-s)/dur,1), e=1-Math.pow(1-p,3);
        n.textContent=Math.round(ini+(alvo-ini)*e)+suf;
        if(p<1) requestAnimationFrame(passo); };
      requestAnimationFrame(passo);
    }, atraso);
  });
}

/* inserts: cada take toca uma vez e passa a vez para o próximo */
function videos(el){
  el.querySelectorAll(".video-fundo").forEach(cx=>{
    const vs=[...cx.querySelectorAll("video")];
    if(!vs.length) return;
    const rate=+cx.dataset.rate||1;
    vs.forEach(v=>{ v.playbackRate=rate; v.muted=true; v.loop=false; v.style.opacity="0"; });
    (function toca(k){
      const v=vs[k%vs.length];
      v.currentTime=0; v.style.opacity="1";
      v.play().then(()=>{v.playbackRate=rate;}).catch(()=>{});
      v.onended=()=>{ v.onended=null; toca(k+1); agendar(()=>{v.style.opacity="0";},480); };
    })(0);
  });
}

function mostra(n){
  limpar();
  palco.innerHTML="";
  const c=CENAS[n], d=document.createElement("div");
  d.className=`cena ${c.cls}`; d.innerHTML=c.html; palco.appendChild(d);
  tocaCena(n); telas(d); digitacao(d); contadores(d); videos(d);
  timer=agendar(()=>{ d.classList.add("saindo");
    agendar(()=>{ i++;
      if(i<CENAS.length) mostra(i);
      else{ rodando=false; musicaStop(); btPlay.textContent="▶ Play"; }
    },460);
  }, c.dur*1000-460);
}

const ate=n=>CENAS.slice(0,n).reduce((a,c)=>a+c.dur,0);
function tick(){ if(!rodando)return;
  relogio.textContent=`${Math.min((performance.now()-t0)/1000,TOTAL).toFixed(1)}s / ${TOTAL.toFixed(1)}s`;
  requestAnimationFrame(tick); }
function play(){ if(rodando)return; rodando=true; btPlay.textContent="⏸ Rodando";
  audioOn();
  if(ac.state==="suspended") ac.resume().then(musicaStart); else musicaStart();
  t0=performance.now()-ate(i)*1000; mostra(i); tick(); }
function pausa(){ limpar(); musicaStop(); rodando=false; btPlay.textContent="▶ Play"; }
function reset(){ limpar(); musicaStop(); rodando=false; i=0;
  btPlay.textContent="▶ Play"; relogio.textContent=`0.0s / ${TOTAL.toFixed(1)}s`; mostra(0); limpar(); }

const btPlay=document.getElementById("btPlay");
btPlay.onclick=()=>rodando?pausa():play();
document.getElementById("btReset").onclick=reset;
document.getElementById("btLimpo").onclick=()=>document.body.classList.toggle("gravando");
const btSom=document.getElementById("btSom");
btSom.onclick=()=>{ audioOn();
  const mudo=bus.gain.value>.01;
  bus.gain.setTargetAtTime(mudo?0:.9, ac.currentTime, .05);
  btSom.textContent=mudo?"🔇 Mudo":"🔊 Som"; };
addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault();btPlay.click();} if(e.key==="r")reset(); });
relogio.textContent=`0.0s / ${TOTAL.toFixed(1)}s`; mostra(0);
</script>

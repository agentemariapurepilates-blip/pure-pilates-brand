<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure Pilates · Franchising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#C12030; --vermelho-vivo:#E11B2E;
  --creme:#F4EFE7; --creme-2:#EDE6DA;
  --preto:#231F20; --lima:#C8D92C;
  --azul:#2B5FD9; --ambar:#E8A020; --verde:#12A05A;
  --madeira:#C98A52; --madeira-2:#A96C3C; --grafite:#2B2B2E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Montserrat,Arial,sans-serif}

#palco{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
       transform-origin:center;overflow:hidden;background:var(--creme)}
.cena{position:absolute;inset:0}
.cena.saindo{animation:sair .5s cubic-bezier(.4,0,.6,1) forwards}
@keyframes sair{to{opacity:0;filter:blur(20px);transform:scale(1.03)}}

.bg-creme{background:radial-gradient(120% 90% at 70% 20%,#FBF7F1,var(--creme) 45%,var(--creme-2))}
.bg-preto{background:#050505}
.bg-lima{background:var(--lima)}
.bg-bordo{background:radial-gradient(90% 80% at 30% 45%,#6B1418,#3A0B0E 55%,#1A0406)}

/* ---------- brasa ---------- */
.brasa{position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,#FF4A22,#C1201F 22%,rgba(140,20,20,.45) 42%,transparent 68%);
  filter:blur(6px);animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
.fagulha{position:absolute;width:4px;height:4px;border-radius:50%;background:#FF7A3C;opacity:0;
  animation:sobe 3.2s linear infinite}
@keyframes sobe{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-320px) scale(.2)}}

/* ---------- tipografia ---------- */
.rotulo{font-size:19px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
        color:var(--vermelho);margin-bottom:26px}
.manchete{font-weight:900;text-transform:uppercase;color:var(--preto);
          font-size:80px;line-height:.98;letter-spacing:-.02em;max-width:15ch}
.manchete.media{font-size:64px;max-width:19ch}
.manchete.pequena{font-size:50px;max-width:25ch;line-height:1.04}
.linha{display:block;overflow:hidden;padding-bottom:.06em}
.linha>span{display:block;transform:translateY(105%);animation:sobeLinha .8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes sobeLinha{to{transform:translateY(0)}}
.sub{margin-top:34px;font-size:23px;line-height:1.5;color:#5A5350;max-width:46ch}
.fade{opacity:0;animation:aparece .7s ease forwards}
@keyframes aparece{to{opacity:1}}
.grifo{position:relative;display:inline-block;padding:0 .12em;z-index:0}
.grifo::before{content:"";position:absolute;left:0;right:0;top:14%;bottom:10%;background:var(--lima);
  z-index:-1;transform:scaleX(0);transform-origin:left;animation:varre .5s cubic-bezier(.7,0,.3,1) forwards}
@keyframes varre{to{transform:scaleX(1)}}
.vermelho{color:var(--vermelho-vivo)}

.bloco{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;
       padding:0 120px;gap:60px}
.texto{z-index:2}
.visual{position:relative;height:100%;display:flex;align-items:center;justify-content:center;perspective:1500px}

/* ================= MAPA — pins nascem um a um ================= */
.mapa{position:relative;width:560px;filter:drop-shadow(0 40px 46px rgba(120,80,50,.16))}
.mapa svg{width:100%;display:block}
.pin{position:absolute;width:20px;height:20px;transform:translate(-50%,-100%) scale(0);
     transform-origin:bottom center;animation:pipoca .5s cubic-bezier(.34,1.56,.64,1) forwards}
.pin i{display:block;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--vermelho-vivo);
       transform:rotate(-45deg);box-shadow:0 4px 8px rgba(180,20,30,.4)}
.pin b{position:absolute;left:50%;bottom:-3px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
       border:2px solid rgba(225,27,46,.55);transform:scale(0);animation:onda 1.6s ease-out infinite}
@keyframes pipoca{to{transform:translate(-50%,-100%) scale(1)}}
@keyframes onda{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ================= CANAIS — cards + fios que se desenham ================= */
.canais{position:relative;width:640px;height:520px}
.canal{position:absolute;width:250px;background:#fff;border-radius:18px;padding:16px 18px;
  box-shadow:0 22px 40px rgba(80,55,40,.14);display:flex;align-items:center;gap:12px;
  opacity:0;transform:translateX(-46px) scale(.92);
  animation:entraCanal .6s cubic-bezier(.16,1,.3,1) forwards}
@keyframes entraCanal{to{opacity:1;transform:translateX(0) scale(1)}}
.canal .dot{width:22px;height:22px;border-radius:50%;flex:none}
.canal .nome{font-size:16px;font-weight:700;color:var(--preto)}
.canal .tipo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A79D96;font-weight:700}
.fios{position:absolute;inset:0;overflow:visible}
.fios path{fill:none;stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:420;stroke-dashoffset:420;animation:desenha 1s ease-out forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.no-luz{position:absolute;right:6px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;
  background:radial-gradient(circle,#fff,#FFD08A 40%,rgba(255,170,60,0) 72%);
  transform:scale(0);animation:pipoca2 .6s cubic-bezier(.34,1.56,.64,1) 1.5s forwards}
@keyframes pipoca2{to{transform:scale(1)}}
.balao-wa{position:absolute;right:-20px;bottom:14%;background:#DCF8C6;border-radius:16px;
  border-bottom-right-radius:4px;padding:14px 18px;font-size:18px;color:#2B3A2E;
  box-shadow:0 18px 32px rgba(80,55,40,.16);opacity:0;transform:translateY(16px);
  animation:aparece2 .5s ease 2s forwards}
@keyframes aparece2{to{opacity:1;transform:translateY(0)}}

/* ================= FONE / CHAT ================= */
.fone{width:330px;height:660px;border-radius:46px;background:#111;padding:12px;
  box-shadow:0 60px 90px rgba(60,35,25,.3);transform:rotateY(-14deg) rotateX(4deg) translateY(50px);
  opacity:0;animation:entraFone 1s cubic-bezier(.16,1,.3,1) .3s forwards}
@keyframes entraFone{to{opacity:1;transform:rotateY(-14deg) rotateX(4deg) translateY(0)}}
.tela{width:100%;height:100%;border-radius:36px;background:#EFE7DE;overflow:hidden;display:flex;flex-direction:column}
.topo{background:#0C6157;color:#fff;padding:14px 16px;font-size:13px;font-weight:700}
.topo small{display:block;font-weight:400;opacity:.75;font-size:10px}
.chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
.balao{max-width:84%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.35;
  opacity:0;transform:translateY(12px) scale(.96);animation:aparece3 .4s cubic-bezier(.34,1.4,.64,1) forwards}
@keyframes aparece3{to{opacity:1;transform:translateY(0) scale(1)}}
.balao.dele{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.balao.dela{background:#DCF8C6;align-self:flex-end;border-top-right-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:#fff;border:1px solid #E3DCD3;border-radius:999px;padding:4px 10px;font-size:10.5px;color:#5A5350}

/* ================= ECOSSISTEMA — objetos orbitando ================= */
.orbita{position:relative;width:560px;height:560px}
.nucleo{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FF6A55,var(--vermelho-vivo) 55%,#8E0F1C);
  box-shadow:0 0 70px rgba(225,27,46,.4),inset -14px -18px 34px rgba(0,0,0,.28);
  transform:scale(0);animation:pipoca2 .7s cubic-bezier(.34,1.56,.64,1) forwards}
.sat{position:absolute;left:50%;top:50%;transform-origin:center;opacity:0;
  animation:entraSat .8s cubic-bezier(.16,1,.3,1) forwards, gira 18s linear infinite}
@keyframes entraSat{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1}}
@keyframes gira{to{}}
.objeto{background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(80,55,40,.18);
  border:1px solid #EAE2D8;position:relative;overflow:hidden}
.obj-fone{width:110px;height:200px;border-radius:20px;background:#fff}
.obj-fone .bar{height:26px;background:var(--vermelho);opacity:.9}
.obj-fone .ln{height:8px;margin:12px 14px;border-radius:4px;background:#EDE6DA}
.obj-note{width:220px;height:140px;border-radius:14px}
.obj-note .bar{height:22px;background:#EDE6DA}
.obj-note .ln{height:8px;margin:12px 16px;border-radius:4px;background:#F0EAE1}
.obj-note .pe{position:absolute;left:12%;right:12%;bottom:-8px;height:8px;border-radius:0 0 8px 8px;background:#E3DBD1}
.obj-cal{width:150px;height:170px}
.obj-cal .bar{height:30px;background:var(--verde);opacity:.85}
.obj-cal .grade{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px}
.obj-cal .grade i{display:block;height:14px;border-radius:3px;background:#EDE6DA}
.obj-cal .grade i.on{background:var(--lima)}

/* ================= REFORMER SVG — monta peça por peça ================= */
.reformer{width:660px}
.reformer svg{width:100%;display:block;overflow:visible}
.peca{opacity:0;animation:montaPeca .85s cubic-bezier(.16,1,.3,1) forwards}
@keyframes montaPeca{to{opacity:1;transform:translate(0,0)}}

/* ================= WELLHUB — moedas correndo ================= */
.repasse{position:relative;width:620px;height:420px;display:flex;align-items:center;justify-content:space-between}
.cartao-w{border-radius:22px;box-shadow:0 26px 46px rgba(80,55,40,.2);opacity:0;
  animation:entraCartaoW .7s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
@keyframes entraCartaoW{from{opacity:0;transform:translateY(30px) rotate(-8deg) scale(.9)}
                        to{opacity:1;transform:translateY(0) rotate(-7deg) scale(1)}}
.cartao-w.destino{animation-name:entraCartaoD}
@keyframes entraCartaoD{from{opacity:0;transform:translateY(30px) rotate(8deg) scale(.9)}
                        to{opacity:1;transform:translateY(0) rotate(6deg) scale(1)}}
.w-origem{width:240px;height:150px;background:linear-gradient(135deg,#FF8A2B,#F26B21)}
.w-destino{width:200px;height:130px;background:#fff;border:1px solid #EDE6DA;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.w-destino .cap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A79D96;font-weight:800}
.w-destino .val{font-size:30px;font-weight:900;color:var(--preto)}
.moeda{position:absolute;left:250px;top:50%;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFE9A8,#F4B740 60%,#C98A18);
  box-shadow:0 2px 6px rgba(190,130,20,.4);opacity:0;
  animation:voa 1.8s ease-in-out infinite}
@keyframes voa{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  12%{opacity:1}
  50%{transform:translate(70px,-72px) scale(1)}
  88%{opacity:1}
  100%{opacity:0;transform:translate(150px,10px) scale(.6)}
}

/* ================= FUNIL ================= */
.barras{display:flex;align-items:flex-end;gap:38px;height:340px}
.barra{width:112px;border-radius:12px 12px 4px 4px;transform-origin:bottom;transform:scaleY(0);
  animation:cresce .8s cubic-bezier(.16,1,.3,1) forwards;position:relative}
.barra span{position:absolute;bottom:-38px;left:0;right:0;text-align:center;font-size:14px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7A716C}
@keyframes cresce{to{transform:scaleY(1)}}

/* ================= CONTADOR / CARTÕES ================= */
.contador{font-size:96px;font-weight:900;color:var(--preto);letter-spacing:-.03em;line-height:1}
.contador .de{color:#B9AFA8}
.contador .seta{color:var(--vermelho);margin:0 .12em}
.cartao{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 26px 46px rgba(80,55,40,.14);
  opacity:0;transform:translateY(28px);animation:aparece2 .6s cubic-bezier(.16,1,.3,1) forwards}
.cartao h4{font-size:19px;font-weight:800;color:var(--preto)}
.cartao .cap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A79D96;font-weight:800;margin-bottom:4px}

/* ================= CARTELAS / FECHO ================= */
.cartela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.cartela .palavra{font-size:128px;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;color:var(--preto);text-align:center}
.cartela .trilha{font-size:15px;letter-spacing:.34em;text-transform:uppercase;font-weight:800;color:rgba(35,31,32,.5)}
.bg-bordo .palavra{background:linear-gradient(95deg,#E8341F,#F07A1E 55%,#F6A623);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bg-bordo .trilha{color:rgba(255,220,200,.45)}
.fecho{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.marca-cartao{background:var(--creme);border-radius:20px;padding:28px 44px}
.marca-cartao img{height:88px;display:block}
.tagline{color:#F2E4DC;font-size:26px;font-weight:600}
.prova{color:rgba(242,228,220,.6);font-size:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.cta{margin-top:10px;background:var(--vermelho-vivo);color:#fff;font-size:22px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:16px 36px;border-radius:10px}
.linha-dados{position:absolute;left:0;right:0;bottom:120px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(225,27,46,.7),transparent);
  transform:scaleX(0);transform-origin:left;animation:varre 2.6s ease forwards}

#hud{position:fixed;left:16px;bottom:16px;z-index:99;display:flex;gap:10px;align-items:center;
     font:600 13px Montserrat,sans-serif;color:#fff}
#hud button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
#hud button:hover{background:rgba(255,255,255,.22)}
#hud .t{opacity:.6;font-variant-numeric:tabular-nums}
body.gravando #hud{display:none}
</style>
</head>
<body>
<div id="palco"></div>
<div id="hud">
  <button id="btPlay">▶ Play</button>
  <button id="btReset">⟲ Reiniciar</button>
  <button id="btLimpo">Modo gravação</button>
  <span class="t" id="relogio"></span>
</div>

<script>
/* ==================================================================
   Pure Pilates · Franchising — motion
   Tudo em CSS/SVG: cada peça anima sozinha.
   Roteiro = array CENAS. Trocar copy é editar texto aqui embaixo.
================================================================== */

const PASSO = .62;   // beat entre uma frase e a próxima

/* manchete: uma frase por vez */
const mh = (linhas, cls="", ini=.25) =>
  `<h1 class="manchete ${cls}">` + linhas.map((l,i)=>
    `<span class="linha"><span style="animation-delay:${(ini+i*PASSO).toFixed(2)}s">${l}</span></span>`
  ).join("") + `</h1>`;
const fimDe = (linhas, ini=.25) => ini + linhas.length*PASSO + .25;
const sub = (t,d) => `<p class="sub fade" style="animation-delay:${d.toFixed(2)}s">${t}</p>`;
const rot = t => `<div class="rotulo fade" style="animation-delay:.05s">${t}</div>`;

/* --- mapa do Brasil simplificado + pins --- */
const BR_PATH = "M120 58 L170 38 L215 44 L246 32 L268 48 L262 74 L292 86 L316 118 L340 150 L348 186 "+
                "L332 214 L322 246 L300 268 L288 300 L268 330 L240 356 L210 372 L182 366 L168 340 "+
                "L146 318 L128 286 L122 250 L100 228 L78 196 L66 160 L76 122 L98 92 Z";
const PINS = [[64,52],[70,58],[66,63],[60,57],[72,49],[58,47],[75,62],[62,70],[55,64],[68,44],
              [50,55],[45,44],[78,55],[57,76],[48,68],[71,71],[41,60],[66,36],[53,38],[74,41]];
const mapa = () => `
  <div class="mapa">
    <svg viewBox="0 0 400 400"><path d="${BR_PATH}" fill="#EDE3D4" stroke="#DFD2BF" stroke-width="2"/></svg>
    ${PINS.map(([x,y],i)=>`<div class="pin" style="left:${x}%;top:${y}%;animation-delay:${(.9+i*.09).toFixed(2)}s">
        <i></i><b style="animation-delay:${(1.2+i*.09).toFixed(2)}s"></b></div>`).join("")}
  </div>`;

/* --- canais + fios --- */
const CANAIS = [
  ["Google Ads","mídia paga","#4285F4",   6,  -190],
  ["Meta Ads","mídia paga","#0866FF",    30,  -95],
  ["Perfil Google","gratuito","#34A853",  0,    0],
  ["Social orgânico","gratuito","#E1306C",30,   95],
  ["Busca orgânica","gratuito","#F4B400", 6,  190],
];
const canais = () => `
  <div class="canais">
    <svg class="fios" viewBox="0 0 640 520" preserveAspectRatio="none">
      ${CANAIS.map(([,,cor,,dy],i)=>`<path d="M270 ${260+dy} C 400 ${260+dy}, 430 260, 560 260"
        stroke="${cor}" opacity=".55" style="animation-delay:${(.7+i*.12).toFixed(2)}s"/>`).join("")}
    </svg>
    ${CANAIS.map(([nome,tipo,cor,dx,dy],i)=>`
      <div class="canal" style="left:${dx}px;top:calc(50% + ${dy}px - 33px);animation-delay:${(.35+i*.14).toFixed(2)}s">
        <span class="dot" style="background:${cor}"></span>
        <span><span class="nome">${nome}</span><br><span class="tipo">${tipo}</span></span>
      </div>`).join("")}
    <div class="no-luz"></div>
    <div class="balao-wa">Oi! Quero conhecer o Pilates 😊</div>
  </div>`;

/* --- ecossistema: satélites em órbita --- */
const sat = (html,ang,raio,atraso) => {
  const x = Math.cos(ang*Math.PI/180)*raio, y = Math.sin(ang*Math.PI/180)*raio;
  return `<div class="sat" style="transform:translate(calc(-50% + ${x}px),calc(-50% + ${y}px));
          animation-delay:${atraso}s, ${atraso+.8}s">${html}</div>`;
};
const ecossistema = () => `
  <div class="orbita">
    <div class="nucleo" style="animation-delay:.3s"></div>
    ${sat(`<div class="objeto obj-fone"><div class="bar"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:50%"></div></div>`, 200, 210, .6)}
    ${sat(`<div class="objeto obj-note"><div class="bar"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div><div class="pe"></div></div>`, 320, 230, 1.25)}
    ${sat(`<div class="objeto obj-cal"><div class="bar"></div><div class="grade">${
      Array.from({length:15},(_,i)=>`<i class="${[3,7,11].includes(i)?'on':''}"></i>`).join("")}</div></div>`, 80, 215, 1.9)}
  </div>`;

/* --- REFORMER: cada peça entra de um lugar --- */
const pecaR = (conteudo, dx, dy, atraso) =>
  `<g class="peca" style="transform:translate(${dx}px,${dy}px);animation-delay:${atraso}s">${conteudo}</g>`;
const reformer = () => `
  <div class="reformer">
  <svg viewBox="0 0 660 300">
    <!-- sombra -->
    <ellipse cx="330" cy="272" rx="250" ry="14" fill="rgba(120,80,50,.13)"
             class="peca" style="transform:translate(0,30px);animation-delay:.2s"/>
    <!-- base + pés -->
    ${pecaR(`
      <rect x="60" y="196" width="540" height="26" rx="7" fill="var(--madeira)"/>
      <rect x="78"  y="222" width="44" height="48" rx="6" fill="var(--madeira-2)"/>
      <rect x="538" y="222" width="44" height="48" rx="6" fill="var(--madeira-2)"/>
    `, 0, 70, .35)}
    <!-- trilhos -->
    ${pecaR(`
      <rect x="92" y="184" width="476" height="7" rx="3.5" fill="#C9C2B8"/>
      <rect x="92" y="172" width="476" height="7" rx="3.5" fill="#D8D2C9"/>
    `, 0, -60, .95)}
    <!-- carrinho -->
    ${pecaR(`<rect x="150" y="128" width="300" height="46" rx="10" fill="var(--grafite)"/>
             <rect x="150" y="128" width="300" height="10" rx="5" fill="#3E3E43"/>`, 0, -120, 1.5)}
    <!-- apoios de ombro -->
    ${pecaR(`<circle cx="408" cy="118" r="17" fill="var(--grafite)"/>
             <circle cx="446" cy="118" r="17" fill="var(--grafite)"/>`, 90, -150, 2.0)}
    <!-- barra de pés -->
    ${pecaR(`<path d="M86 196 L104 108 L148 108" stroke="var(--grafite)" stroke-width="13"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, -110, -40, 2.4)}
    <!-- molas -->
    ${pecaR(`${[0,1,2,3].map(i=>`<line x1="470" y1="${150+i*12}" x2="556" y2="${150+i*12}"
              stroke="#B9B2A8" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 5"/>`).join("")}`,

/* ================== motor ================== */
const palco=document.getElementById("palco"), relogio=document.getElementById("relogio");
const TOTAL=CENAS.reduce((a,c)=>a+c.dur,0);
const escala=()=>palco.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;
addEventListener("resize",escala); escala();

let i=0,timer=null,t0=0,rodando=false;
function contadores(el){
  el.querySelectorAll("[data-conta]").forEach(n=>{
    const alvo=+n.dataset.conta, ini=+n.textContent||0, suf=n.dataset.suf||"";
    let s=null; const dur=1300;
    const passo=ts=>{ if(!s)s=ts;
      const p=Math.min((ts-s)/dur,1), e=1-Math.pow(1-p,3);
      n.textContent=Math.round(ini+(alvo-ini)*e)+suf;
      if(p<1)requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
function mostra(n){
  palco.innerHTML="";
  const c=CENAS[n], d=document.createElement("div");
  d.className=`cena ${c.cls}`; d.innerHTML=c.html; palco.appendChild(d);
  setTimeout(()=>contadores(d),1000);
  timer=setTimeout(()=>{ d.classList.add("saindo");
    setTimeout(()=>{ i++;
      if(i<CENAS.length) mostra(i);
      else{ rodando=false; btPlay.textContent="▶ Play"; }
    },460);
  }, c.dur*1000-460);
}
const ate=n=>CENAS.slice(0,n).reduce((a,c)=>a+c.dur,0);
function tick(){ if(!rodando)return;
  relogio.textContent=`${Math.min((performance.now()-t0)/1000,TOTAL).toFixed(1)}s / ${TOTAL.toFixed(1)}s`;
  requestAnimationFrame(tick); }
function play(){ if(rodando)return; rodando=true; btPlay.textContent="⏸ Rodando";
  t0=performance.now()-ate(i)*1000; mostra(i); tick(); }
function reset(){ clearTimeout(timer); rodando=false; i=0;
  btPlay.textContent="▶ Play"; relogio.textContent=`0.0s / ${TOTAL.toFixed(1)}s`; mostra(0); clearTimeout(timer); }

const btPlay=document.getElementById("btPlay");
btPlay.onclick=()=>rodando?(clearTimeout(timer),rodando=false,btPlay.textContent="▶ Play"):play();
document.getElementById("btReset").onclick=reset;
document.getElementById("btLimpo").onclick=()=>document.body.classList.toggle("gravando");
addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault();btPlay.click();} if(e.key==="r")reset(); });
relogio.textContent=`0.0s / ${TOTAL.toFixed(1)}s`; mostra(0);
</script>

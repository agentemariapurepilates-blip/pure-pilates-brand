<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure Pilates · Franchising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800&display=swap" rel="stylesheet">
<style>
  :root{
    --vermelho:#C12030;
    --vermelho-vivo:#E11B2E;
    --creme:#F4EFE7;
    --creme-2:#EDE6DA;
    --preto:#231F20;
    --lima:#C8D92C;
    --azul:#2B5FD9;
    --ambar:#E8A020;
    --bordo:#3A0B0E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:Montserrat,Arial,sans-serif}

  /* palco 16:9 que escala para qualquer tela; grave a tela em cima dele */
  #palco{
    position:absolute;top:50%;left:50%;
    width:1920px;height:1080px;
    transform-origin:center center;
    overflow:hidden;background:var(--creme);
  }

  .cena{position:absolute;inset:0;opacity:0;pointer-events:none}
  .cena.ativa{opacity:1}
  .cena.saindo{animation:sair .5s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes sair{to{opacity:0;filter:blur(18px);transform:scale(1.03)}}

  /* ---------- fundos ---------- */
  .bg-creme{background:radial-gradient(120% 90% at 70% 20%,#FBF7F1 0%,var(--creme) 45%,var(--creme-2) 100%)}
  .bg-preto{background:#050505}
  .bg-lima{background:var(--lima)}
  .bg-bordo{background:radial-gradient(90% 80% at 30% 45%,#6B1418 0%,var(--bordo) 55%,#1A0406 100%)}

  /* brasa pulsante da abertura */
  .brasa{
    position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,#FF4A22 0%,#C1201F 22%,rgba(140,20,20,.45) 42%,transparent 68%);
    filter:blur(6px);animation:pulsa 2.4s ease-in-out infinite;
  }
  @keyframes pulsa{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
  .fagulha{position:absolute;width:4px;height:4px;border-radius:50%;background:#FF7A3C;opacity:0;animation:sobe 3.2s linear infinite}
  @keyframes sobe{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-320px) scale(.2)}}

  /* ---------- tipografia ---------- */
  .rotulo{
    font-size:19px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
    color:var(--vermelho);margin-bottom:26px;
  }
  .manchete{
    font-weight:900;text-transform:uppercase;color:var(--preto);
    font-size:82px;line-height:.96;letter-spacing:-.02em;max-width:15ch;
  }
  .manchete.media{font-size:66px;max-width:19ch}
  .manchete.pequena{font-size:54px;max-width:24ch;line-height:1.02}
  .sub{
    margin-top:34px;font-size:23px;line-height:1.5;font-weight:400;
    color:#5A5350;max-width:46ch;
  }
  /* revelação linha a linha */
  .linha{display:block;overflow:hidden}
  .linha > span{display:block;transform:translateY(105%);animation:sobeLinha .75s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes sobeLinha{to{transform:translateY(0)}}
  .fade{opacity:0;animation:aparece .7s ease forwards}
  @keyframes aparece{to{opacity:1}}

  /* grifo verde-limão que varre por trás da palavra */
  .grifo{position:relative;display:inline-block;padding:0 .12em;color:var(--preto)}
  .grifo::before{
    content:"";position:absolute;left:0;right:0;top:12%;bottom:8%;background:var(--lima);z-index:-1;
    transform:scaleX(0);transform-origin:left center;animation:varre .55s cubic-bezier(.7,0,.3,1) forwards;
  }
  @keyframes varre{to{transform:scaleX(1)}}
  .vermelho{color:var(--vermelho-vivo)}

  /* ---------- layout dos blocos ---------- */
  .bloco{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;
         padding:0 120px;gap:70px}
  .texto{z-index:2}
  .palco-visual{position:relative;height:100%;display:flex;align-items:center;justify-content:center;perspective:1400px}

  /* ---------- peças 3D / cards ---------- */
  .heroi{max-width:88%;max-height:78%;object-fit:contain;
         background:#fff;border-radius:30px;padding:14px;
         box-shadow:0 44px 70px rgba(70,45,35,.15),0 2px 8px rgba(70,45,35,.07);
         opacity:0;transform:translateY(60px) scale(.94);
         animation:entraHeroi 1.1s cubic-bezier(.16,1,.3,1) .35s forwards}
  @keyframes entraHeroi{to{opacity:1;transform:translateY(0) scale(1)}}
  .flutua{animation:entraHeroi 1.1s cubic-bezier(.16,1,.3,1) .35s forwards, balanca 6s ease-in-out 1.6s infinite}
  @keyframes balanca{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(.5deg)}}

  .cartao{
    background:#fff;border-radius:22px;padding:26px 30px;
    box-shadow:0 30px 60px rgba(70,45,35,.16),0 2px 6px rgba(70,45,35,.06);
    opacity:0;transform:translateY(34px);animation:entraCartao .7s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes entraCartao{to{opacity:1;transform:translateY(0)}}
  .cartao h4{font-size:20px;font-weight:800;color:var(--preto);margin-bottom:4px}
  .cartao .cap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9A918C;font-weight:700}

  /* contador grande */
  .contador{font-size:96px;font-weight:900;color:var(--preto);letter-spacing:-.03em;line-height:1}
  .contador .de{color:#B9AFA8}
  .contador .seta{color:var(--vermelho);margin:0 .12em}

  /* barras do funil */
  .barras{display:flex;align-items:flex-end;gap:38px;height:330px}
  .barra{width:110px;border-radius:12px 12px 4px 4px;transform-origin:bottom;transform:scaleY(0);
         animation:cresce .85s cubic-bezier(.16,1,.3,1) forwards;position:relative}
  .barra span{position:absolute;bottom:-38px;left:0;right:0;text-align:center;font-size:14px;
              font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A716C}
  @keyframes cresce{to{transform:scaleY(1)}}

  /* telefone da Vitória */
  .fone{width:330px;height:660px;border-radius:46px;background:#111;padding:12px;
        box-shadow:0 60px 90px rgba(60,35,25,.32);transform:rotateY(-14deg) rotateX(4deg);
        opacity:0;animation:entraHeroi 1.1s cubic-bezier(.16,1,.3,1) .3s forwards}
  .tela{width:100%;height:100%;border-radius:36px;background:#EFE7DE;overflow:hidden;display:flex;flex-direction:column}
  .topo{background:#0C6157;color:#fff;padding:14px 16px;font-size:13px;font-weight:700}
  .topo small{display:block;font-weight:400;opacity:.75;font-size:10px}
  .chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
  .balao{max-width:82%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.35;
         opacity:0;transform:translateY(12px);animation:entraCartao .45s ease forwards}
  .balao.dele{background:#fff;align-self:flex-start;border-top-left-radius:3px}
  .balao.dela{background:#DCF8C6;align-self:flex-end;border-top-right-radius:3px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chip{background:#fff;border:1px solid #E3DCD3;border-radius:999px;padding:4px 10px;font-size:10.5px;color:#5A5350}

  /* selos */
  .selo{display:inline-block;background:var(--lima);color:var(--preto);font-size:13px;font-weight:800;
        letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:8px}
  .selo.verde{background:#12A05A;color:#fff}

  /* cartelas de respiro */
  .cartela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
  .cartela .palavra{font-size:170px;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;color:var(--preto)}
  .cartela .trilha{font-size:15px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;color:rgba(35,31,32,.5)}
  .bg-bordo .palavra{
    background:linear-gradient(95deg,#E8341F 0%,#F07A1E 55%,#F6A623 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .bg-bordo .trilha{color:rgba(255,220,200,.45)}

  /* fecho */
  .fecho{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .marca-cartao{background:var(--creme);border-radius:20px;padding:30px 46px;display:flex;align-items:center;gap:18px}
  .marca-cartao img{height:92px}
  .tagline{color:#F2E4DC;font-size:26px;font-weight:600}
  .prova{color:rgba(242,228,220,.6);font-size:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
  .cta{margin-top:12px;background:var(--vermelho-vivo);color:#fff;font-size:22px;font-weight:800;
       letter-spacing:.06em;text-transform:uppercase;padding:16px 36px;border-radius:10px}

  /* linha de dados que corre no rodapé do fecho */
  .linha-dados{position:absolute;left:0;right:0;bottom:120px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(225,27,46,.7),transparent);
    transform:scaleX(0);transform-origin:left;animation:varre 2.6s ease forwards}

  /* ---------- controles (não entram na gravação) ---------- */
  #hud{position:fixed;left:16px;bottom:16px;z-index:99;display:flex;gap:10px;align-items:center;
       font:600 13px Montserrat,sans-serif;color:#fff}
  #hud button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
  #hud button:hover{background:rgba(255,255,255,.22)}
  #hud .t{opacity:.6;font-variant-numeric:tabular-nums}
  body.gravando #hud{display:none}
</style>
</head>
<body>

<div id="palco"></div>

<div id="hud">
  <button id="btPlay">▶ Play</button>
  <button id="btReset">⟲ Reiniciar</button>
  <button id="btLimpo">Modo gravação</button>
  <span class="t" id="relogio">0.0s / 0.0s</span>
</div>

<script>
/* ------------------------------------------------------------------
   Pure Pilates · Franchising — animatic
   O roteiro vive em CENAS. Cada cena declara duração e HTML.
   Trocar copy = editar aqui. Trocar peça 3D = trocar o src da imagem.
------------------------------------------------------------------- */

const IMG = {
  mapa:     "assets/3d-mapa-brasil.png",
  canais:   "assets/3d-canais.png",
  ecoss:    "assets/3d-ecossistema.png",
  reformer: "assets/3d-reformer-montando.png",
  wellhub:  "assets/3d-wellhub.png",
  logo:     "../marca/logo-pure-pilates.png",
};

/* helper: manchete com revelação linha a linha */
const mh = (linhas, classe="") => `<h1 class="manchete ${classe}">` +
  linhas.map((l,i)=>`<span class="linha"><span style="animation-delay:${.15+i*.12}s">${l}</span></span>`).join("") +
  `</h1>`;

const sub = (t, d=.9) => `<p class="sub fade" style="animation-delay:${d}s">${t}</p>`;
const rot = (t) => `<div class="rotulo fade" style="animation-delay:.05s">${t}</div>`;

const CENAS = [

/* ---------------- ABERTURA ---------------- */
{ dur: 6, cls: "bg-preto", html: `
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
    <div class="brasa" style="left:22%"></div>
    ${Array.from({length:14},(_,i)=>
      `<div class="fagulha" style="left:${20+Math.random()*10}%;top:${52+Math.random()*10}%;animation-delay:${i*.22}s"></div>`).join("")}
    <div style="position:relative;z-index:2;color:#fff;text-align:center">
      ${mh(["ABRIR UM ESTÚDIO DE PILATES","QUALQUER UM ABRE."],"media")}
      <div style="height:54px"></div>
      <h1 class="manchete" style="color:#fff;margin:0 auto">
        <span class="linha"><span style="animation-delay:2.5s">TER SUCESSO</span></span>
        <span class="linha"><span style="animation-delay:2.72s" class="vermelho">É OUTRA COISA.</span></span>
      </h1>
    </div>
  </div>
  <style>.bg-preto .manchete{color:#fff;max-width:none}</style>
`},

/* ---------------- A MARCA ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${mh(["VOCÊ NÃO COMEÇA DO ZERO,","COMEÇA COM SUPORTE,","APOIO DO INÍCIO AO FIM E","UMA MARCA RECONHECIDA."],"pequena")}
      ${sub("Quando a sua unidade abre, o nome Pure Pilates faz total diferença.")}
      <div class="contador fade" style="animation-delay:1.4s;margin-top:38px;font-size:62px">
        <span data-conta="492">0</span> <span style="font-size:22px;font-weight:700;letter-spacing:.2em;color:#9A918C">UNIDADES</span>
        <span class="de" style="margin:0 .2em">·</span>
        <span data-conta="89">0</span> <span style="font-size:22px;font-weight:700;letter-spacing:.2em;color:#9A918C">CIDADES</span>
      </div>
    </div>
    <div class="palco-visual"><img class="heroi flutua" src="${IMG.mapa}" alt=""></div>
  </div>
`},

/* ---------------- MARKETING ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Marketing")}
      ${mh(["O MARKETING NÃO É UM","BICHO DE SETE CABEÇAS","PARA O FRANQUEADO","PURE PILATES."],"pequena")}
      ${sub("Campanha nacional, criativos prontos e mídia rodando na sua região. Você recebe o lead, não a tarefa de gerar o lead.")}
    </div>
    <div class="palco-visual">
      <img class="heroi" src="${IMG.canais}" alt="">
      <div class="cartao" style="position:absolute;bottom:14%;right:4%;animation-delay:1.6s;background:#DCF8C6;border-radius:14px;border-top-right-radius:3px;padding:14px 18px;font-size:17px;max-width:280px">
        Oi! Quero conhecer o Pilates 😊
      </div>
    </div>
  </div>
`},

/* ---------------- CARTELA ---------------- */
{ dur: 2, cls: "bg-lima", html: `
  <div class="cartela">
    <div class="palavra"><span class="linha"><span>CHEGOU O LEAD.</span></span></div>
    <div class="trilha fade" style="animation-delay:.5s">Marca · Marketing · Tecnologia · Operação</div>
  </div>
  <style>.bg-lima .palavra{font-size:120px}</style>
`},

/* ---------------- A VITÓRIA ---------------- */
{ dur: 10, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Tecnologia")}
      ${mh(["A VITÓRIA RESPONDE.",`INCLUSIVE QUANDO VOCÊ <span class="grifo" style="animation-delay:1.1s">DORME.</span>`],"media")}
      ${sub("Ela tira a dúvida, acha a unidade mais perto, mostra horário e agenda a experimental. Se o lead some, ela volta atrás dele.",1.3)}
      <div class="chips fade" style="animation-delay:2.2s;margin-top:26px">
        <span class="chip" style="font-size:14px;padding:8px 16px">15 min</span>
        <span class="chip" style="font-size:14px;padding:8px 16px">2 h</span>
        <span class="chip" style="font-size:14px;padding:8px 16px">6 h</span>
        <span class="chip" style="font-size:14px;padding:8px 16px">12 h</span>
        <span style="font-size:13px;color:#9A918C;align-self:center;margin-left:8px;letter-spacing:.14em;font-weight:700;text-transform:uppercase">sumiu? ela volta</span>
      </div>
    </div>
    <div class="palco-visual">
      <div class="fone"><div class="tela">
        <div class="topo">Pure Pilates<small>Vitória · online</small></div>
        <div class="chat">
          <div class="balao dela" style="animation-delay:1.0s">Oi! Quero conhecer o Pilates 😊</div>
          <div class="balao dele" style="animation-delay:1.9s">Oi! Eu sou a Vitória, da Pure Pilates. Me conta: em que bairro você mora?</div>
          <div class="balao dela" style="animation-delay:2.9s">Perto da Paulista</div>
          <div class="balao dele" style="animation-delay:3.8s">Achei 3 unidades perto de você. Estes horários estão livres amanhã:
            <div class="chips"><span class="chip">07:00</span><span class="chip">12:00</span><span class="chip">18:00</span></div>
          </div>
          <div class="balao dele" style="animation-delay:5.0s;background:#D6F0DC">Aula agendada! ✅ Te vejo amanhã às 18:00.</div>
        </div>
      </div></div>
    </div>
  </div>
`},

/* ---------------- TECNOLOGIA ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Tecnologia")}
      <h1 class="manchete media">
        <span class="linha"><span style="animation-delay:.2s">APLICATIVO</span></span>
        <span class="linha"><span style="animation-delay:.6s">SITE</span></span>
        <span class="linha"><span style="animation-delay:1.0s">AGENDAMENTO ONLINE</span></span>
        <span class="linha"><span style="animation-delay:1.7s"><span class="grifo" style="animation-delay:2.0s">TUDO JÁ DE PÉ.</span></span></span>
      </h1>
      ${sub("Você aprende como gerir tudo que recebe assim que abre uma Pure.",2.4)}
    </div>
    <div class="palco-visual"><img class="heroi flutua" src="${IMG.ecoss}" alt=""></div>
  </div>
`},

/* ---------------- TREINAMENTO ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Suporte")}
      ${mh([`VENDER PODE SER <span class="grifo" style="animation-delay:.7s">APRENDIDO.</span>`],"media")}
      ${sub("Sua equipe entra treinada: script da experimental, régua de follow-up e tudo que você precisa para conseguir converter os leads que chegam.")}
    </div>
    <div class="palco-visual" style="flex-direction:column;gap:30px">
      <div class="contador fade" style="animation-delay:1.2s">
        <span class="de">41%</span><span class="seta">→</span><span data-conta="68" data-suf="%">41</span>
      </div>
      <div class="fade" style="animation-delay:1.6s;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#9A918C;font-weight:700">de comparecimento com o lembrete</div>
      <div style="display:flex;gap:22px;margin-top:20px">
        <div class="cartao" style="animation-delay:2.1s;border-left:5px solid #12A05A">
          <div class="cap">Veio</div><h4>Como foi a sua aula?</h4>
        </div>
        <div class="cartao" style="animation-delay:2.4s;border-left:5px solid var(--ambar)">
          <div class="cap">Faltou</div><h4>Podemos remarcar?</h4>
        </div>
      </div>
    </div>
  </div>
`},

/* ---------------- CARTELA ---------------- */
{ dur: 2, cls: "bg-lima", html: `
  <div class="cartela">
    <div class="palavra"><span class="linha"><span>MATRICULOU.</span></span></div>
    <div class="trilha fade" style="animation-delay:.5s">Agendou · Compareceu · Matriculou</div>
  </div>
`},

/* ---------------- METALIFE ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Operação")}
      ${mh(["MONTAGEM E MANUTENÇÃO","DOS APARELHOS."],"media")}
      ${sub("MetaLife: parcelamento dos aparelhos, montagem e manutenção. Você não vira gestor de obra.")}
    </div>
    <div class="palco-visual"><img class="heroi flutua" src="${IMG.reformer}" alt=""></div>
  </div>
`},

/* ---------------- WELLHUB ---------------- */
{ dur: 9, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      ${rot("Operação")}
      ${mh(["EXCLUSIVOS WELLHUB.",`REPASSE MAIOR NO SEU <span class="grifo" style="animation-delay:1.1s">CAIXA.</span>`],"media")}
      ${sub("Somos a única rede de Pilates exclusiva Wellhub — e isso vira dinheiro na sua unidade, todo mês.",1.3)}
    </div>
    <div class="palco-visual"><img class="heroi flutua" src="${IMG.wellhub}" alt=""></div>
  </div>
`},

/* ---------------- O FUNIL ---------------- */
{ dur: 8, cls: "bg-creme", html: `
  <div class="bloco">
    <div class="texto">
      <h1 class="manchete media">
        <span class="linha"><span style="animation-delay:.2s;color:var(--azul)">O LEAD AGENDOU</span></span>
        <span class="linha"><span style="animation-delay:.7s;color:var(--ambar)">COMPARECEU</span></span>
        <span class="linha"><span style="animation-delay:1.2s;color:var(--vermelho)">MATRICULOU</span></span>
      </h1>
      ${sub("A gente não quer só vender unidades, a gente quer o seu sucesso. Nenhuma unidade fechada até agora — e nosso objetivo é continuar assim.",1.8)}
    </div>
    <div class="palco-visual">
      <div class="barras">
        <div class="barra" style="height:100%;background:var(--azul);animation-delay:.3s"><span>Agendou</span></div>
        <div class="barra" style="height:68%;background:var(--ambar);animation-delay:.8s"><span>Compareceu</span></div>
        <div class="barra" style="height:42%;background:var(--vermelho);animation-delay:1.3s"><span>Matriculou</span></div>
      </div>
    </div>
  </div>
`},

/* ---------------- CARTELA FINAL ---------------- */
{ dur: 3, cls: "bg-bordo", html: `
  <div class="cartela">
    <div class="brasa" style="left:12%;top:20%;opacity:.5"></div>
    <div class="palavra" style="position:relative;z-index:2"><span class="linha"><span>VOCÊ NÃO ABRE SOZINHO.</span></span></div>
    <div class="trilha fade" style="animation-delay:.6s;position:relative;z-index:2">Marca · Tecnologia · Operação</div>
  </div>
  <style>.bg-bordo .palavra{font-size:104px}</style>
`},

/* ---------------- FECHO ---------------- */
{ dur: 6, cls: "bg-bordo", html: `
  <div class="fecho">
    <div class="marca-cartao fade" style="animation-delay:.2s"><img src="${IMG.logo}" alt="Pure Pilates"></div>
    <div class="tagline fade" style="animation-delay:.8s">Marca, tecnologia e operação.</div>
    <div class="prova fade" style="animation-delay:1.2s">492 unidades · 89 cidades</div>
    <div class="cta fade" style="animation-delay:1.8s">Seja um franqueado</div>
  </div>
  <div class="linha-dados"></div>
`},

];

/* ------------------------------------------------------------------ */
const palco = document.getElementById("palco");
const relogio = document.getElementById("relogio");
const TOTAL = CENAS.reduce((a,c)=>a+c.dur,0);

function escala(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  palco.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", escala); escala();

let i = 0, timer = null, t0 = 0, rodando = false;

function contadores(el){
  el.querySelectorAll("[data-conta]").forEach(n=>{
    const alvo = +n.dataset.conta, ini = +n.textContent || 0, suf = n.dataset.suf || "";
    const t = 1200; let s = null;
    const passo = ts => {
      if(!s) s = ts;
      const p = Math.min((ts-s)/t, 1), e = 1 - Math.pow(1-p, 3);
      n.textContent = Math.round(ini + (alvo-ini)*e) + suf;
      if(p<1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}

function mostra(n){
  palco.innerHTML = "";
  const c = CENAS[n];
  const d = document.createElement("div");
  d.className = `cena ativa ${c.cls}`;
  d.innerHTML = c.html;
  palco.appendChild(d);
  setTimeout(()=>contadores(d), 900);
  // saída suave no último meio segundo
  timer = setTimeout(()=>{
    d.classList.add("saindo");
    setTimeout(()=>{
      i++;
      if(i < CENAS.length) mostra(i);
      else { rodando = false; btPlay.textContent = "▶ Play"; }
    }, 460);
  }, c.dur*1000 - 460);
}

function play(){
  if(rodando) return;
  rodando = true; btPlay.textContent = "⏸ Rodando";
  t0 = performance.now() - decorridoAte(i)*1000;
  mostra(i);
  tick();
}
function decorridoAte(n){ return CENAS.slice(0,n).reduce((a,c)=>a+c.dur,0); }
function tick(){
  if(!rodando) return;
  const t = (performance.now()-t0)/1000;
  relogio.textContent = `${Math.min(t,TOTAL).toFixed(1)}s / ${TOTAL.toFixed(1)}s`;
  requestAnimationFrame(tick);
}
function reset(){
  clearTimeout(timer); rodando = false; i = 0;
  btPlay.textContent = "▶ Play";
  relogio.textContent = `0.0s / ${TOTAL.toFixed(1)}s`;
  mostra(0); clearTimeout(timer);
}

const btPlay = document.getElementById("btPlay");
btPlay.onclick = () => rodando ? (clearTimeout(timer), rodando=false, btPlay.textContent="▶ Play") : play();
document.getElementById("btReset").onclick = () => { reset(); };
document.getElementById("btLimpo").onclick = () => document.body.classList.toggle("gravando");
addEventListener("keydown", e => {
  if(e.code === "Space"){ e.preventDefault(); btPlay.click(); }
  if(e.key === "r") reset();
});

relogio.textContent = `0.0s / ${TOTAL.toFixed(1)}s`;
mostra(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<title>Forma 1 — Banner ponta direita · Pure Pilates</title>
</head>
<!--
  FORMA 1 — Banner largo, ponta direita arredondada + canto reto (rabinho)
  Tecnica e-mail-safe: tabela + bgcolor + border-radius
  Assinatura Pure: 3 cantos arredondados + 1 canto reto (90°) = o "rabinho"
  border-radius (sup-esq · sup-dir · inf-dir · inf-esq): 80px 140px 140px 0
  (canto reto = inferior-esquerdo)
  Cor da marca: #C12030
  Compatibilidade: ✅ Gmail / Apple Mail / Yahoo / iOS / Android
                   ⚠️ Outlook desktop (Windows) ignora o arredondamento (vira retangulo)
  Para usar: cole seu conteudo dentro do <td> (troque o &nbsp;).
-->
<body style="margin:0;padding:0;background-color:#F6EFE2;font-family:'Montserrat',Arial,'Helvetica Neue',Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6EFE2" style="background-color:#F6EFE2;">
<tr><td align="center" style="padding:40px 16px;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#C12030" style="background-color:#C12030;border-radius:80px 140px 140px 0;width:520px;height:200px;">
<tr><td align="center" valign="middle" style="color:#ffffff;font-size:1px;line-height:1px;">&nbsp;</td></tr>
</table>

</td></tr>
</table>
</body>
</html>
